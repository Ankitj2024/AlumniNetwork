services:
  mongo:
    image: mongo:7.0.14
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/amn
      # The API refuses to start in production without these (see apps/api/src/config/validate.ts).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (openssl rand -base64 48)}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY (openssl rand -base64 32)}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN to the https:// address of the site}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL to the https:// address of the API}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JOBS_IN_PROCESS: "false"
      SMTP_URL: ${SMTP_URL:?Set SMTP_URL: password reset and email confirmation need it}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM, e.g. "Alumni Mentoring <mentoring@your-college.edu>"}
      REQUIRE_STAFF_2FA: ${REQUIRE_STAFF_2FA:-true}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SSE: ${S3_SSE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/apps/api/uploads

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on: [mongo]
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/amn
      JWT_SECRET: ${JWT_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      WEB_ORIGIN: ${WEB_ORIGIN}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_URL: ${SMTP_URL}
      MAIL_FROM: ${MAIL_FROM}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"

volumes:
  mongo-data:
  uploads:
